<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Franchise Management</title>
  <desc id="desc">A main storefront connected to two franchise branches.</desc>
  <rect width="128" height="128" fill="#FFFFFF"/>

  <!-- Network sits behind the stores so the relationship remains readable at small sizes. -->
  <path d="M64 56V64M64 64L34 82M64 64L94 82" fill="none" stroke="#C4D0D6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Master store -->
  <rect x="39" y="37" width="50" height="34" rx="6" fill="#1E6B8F"/>
  <path d="M35 29H93L87 47H41Z" fill="#28A9DF"/>
  <path d="M35 29H49L47 47H41ZM64 29H78L81 47H67Z" fill="#9B4F86"/>
  <rect x="57" y="52" width="14" height="19" rx="2.5" fill="#FFFFFF"/>
  <circle cx="64" cy="20" r="6" fill="#FFB547"/>

  <!-- Franchise branches -->
  <rect x="17" y="86" width="36" height="25" rx="5" fill="#9B4F86"/>
  <path d="M13 79H57L52 94H18Z" fill="#C66AA8"/>
  <path d="M13 79H24L22 94H18ZM35 79H46L50 94H39Z" fill="#28A9DF"/>
  <rect x="29" y="98" width="11" height="13" rx="2" fill="#FFFFFF" opacity=".94"/>

  <rect x="75" y="86" width="36" height="25" rx="5" fill="#1E6B8F"/>
  <path d="M71 79H115L110 94H76Z" fill="#28A9DF"/>
  <path d="M71 79H82L80 94H76ZM93 79H104L108 94H97Z" fill="#9B4F86"/>
  <rect x="87" y="98" width="11" height="13" rx="2" fill="#FFFFFF" opacity=".94"/>
</svg>
