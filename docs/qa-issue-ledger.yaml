  retest: "Chọn một tuần có hóa đơn đã trả đủ rồi ghi sổ thêm một giấy báo có cùng tuần. Mở Công nợ tuần đó: thẻ tổng quan phải ghi Dư có, Còn phải trả bằng 0, có dòng nêu số tiền được khấu trừ kỳ sau, và không có nút Thanh toán. Dòng giấy báo có phải ghi Giấy báo có và Được trừ kèm số dương, tuyệt đối không ghi Chưa thanh toán. Dán thẳng đường dẫn màn thanh toán của tuần đó vào trình duyệt: phải quay về màn Công nợ kèm thông báo, không thấy mã QR, số tài khoản hay nội dung chuyển khoản. Sang tuần còn nợ thật, mở màn thanh toán: nội dung chuyển khoản phải có số tiền dương đúng bằng số còn phải trả"
  limit: "Nhãn Dư có và Giấy báo có do Dev đề xuất, BA đổi chữ được ở vòng retest. Bảng hóa đơn trên máy tính vẫn để số âm cho dòng giấy báo có vì đó là cách ghi đúng của kế toán; nếu BA muốn đổi sang số dương thì báo để chỉnh"

WJ-DEBT-010:
  sprint: "2026-08-15-C2"
  build_override: "UAT | 15/08/2026 | Sprint 2026-08-15-C2 | commit: c656b95 | Đã deploy UAT, module wujia_portal_debt 19.0.4.0.0 | Dev đã smoke-test lại trên trình duyệt UAT ngày 15/08/2026 ở 391x844 và 1920x1080: 40/40 mục đạt | URL: /portal/debt"
  url: "/portal/debt (cả điện thoại và máy tính)"
  odoo_fit: "Custom"
  fix: "Mở màn Công nợ mà không chọn tuần thì hệ thống không nhảy vào tuần hiện tại nữa. Thứ tự ưu tiên: tuần quá hạn chưa thanh toán cũ nhất, nếu không có thì tuần liền trước, nếu tuần liền trước cũng không phát sinh hóa đơn thì mới là tuần hiện tại. Người dùng bấm chọn tuần khác trong danh sách thì vẫn ra đúng tuần đã chọn. Ngay dưới số tiền có thêm một dòng theo tình trạng của tuần: tuần đã thanh toán ghi ngày Ngô Gia xác nhận, tuần còn nợ ghi hạn thanh toán là thứ Năm của tuần kế tiếp, tuần chưa phát sinh hóa đơn thì còn phải trả bằng 0 và hạn thanh toán ghi dấu gạch. Danh sách chọn tuần giữ nguyên, không thêm nút lùi tuần hay tới tuần. Việc chọn tuần mặc định dùng đúng một lần đọc dữ liệu cho cả sáu tuần nên không làm trang chậm đi"
  impact: "Tuần được mở sẵn khi vào màn Công nợ và dòng thông tin dưới số tiền, cả điện thoại lẫn máy tính. Cách tính số liệu của từng tuần, danh sách chọn tuần, quyền xem và phạm vi cửa hàng không đổi. Đường dẫn có sẵn tham số tuần, kể cả link đã lưu, vẫn mở đúng tuần đó"
  retest: "Với cửa hàng đang có tuần quá hạn chưa thanh toán, mở /portal/debt không kèm tham số: phải tự chọn tuần quá hạn cũ nhất. Cửa hàng không có tuần quá hạn nhưng tuần liền trước có hóa đơn: phải tự chọn tuần liền trước. Cửa hàng không phát sinh gì trong sáu tuần: phải là tuần hiện tại. Chọn tay một tuần khác trong danh sách, hoặc mở đường dẫn có sẵn tham số tuần: phải đúng tuần được chọn. Kiểm dòng dưới số tiền: tuần đã thanh toán ghi Ngô Gia xác nhận kèm ngày, tuần còn nợ ghi Hạn thanh toán là thứ Năm tuần kế tiếp, tuần chưa có hóa đơn ghi Hạn thanh toán dấu gạch và còn phải trả bằng 0"
  limit: "Danh sách chọn tuần vẫn là sáu tuần gần nhất như trước; tuần quá hạn cũ hơn sáu tuần không nằm trong danh sách nên không được chọn làm mặc định. Nếu BA cần nhìn xa hơn thì mở issue riêng để nới danh sách"

