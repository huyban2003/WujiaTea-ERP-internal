WJ-KNW-003:
  sprint: "2026-08-15-C4"
  build_override: "UAT | 15/08/2026 | Sprint 2026-08-15-C4 | commit: a292547 | Đã deploy UAT, module wujia_portal_knowledge 19.0.3.9.0 | Dev đã đo lại trên trình duyệt UAT ngày 15/08/2026 (chỉ đọc, không sửa dữ liệu) ở 391x844 và 1920x1080: 42/42 điểm đạt | URL: /portal/knowledge"
  url: "/portal/knowledge — ô tìm kiếm (cả điện thoại và máy tính)"
  odoo_fit: "Custom"
  fix: "Ô tìm kiếm nay tìm cả trong tiêu đề, phần tóm tắt và phần nội dung của bài, thay vì chỉ tiêu đề. Nội dung được lấy bản chữ đã bỏ hết định dạng nên gõ một cụm bị in đậm hoặc xuống dòng cắt ngang vẫn ra kết quả, và cũng không còn ra kết quả rác do trùng với mã định dạng. Kết quả vẫn chỉ gồm bài đang hiển thị hợp lệ: đã đăng, chưa bị ẩn, đã tới ngày phát hành và chưa hết hạn. Gõ từ khóa không có thì vẫn hiện thông báo chưa có bài viết như bình thường. Ô tìm nhanh gợi ý khi đang gõ cũng dùng đúng một quy tắc này"
  impact: "Ô tìm kiếm ở trang Thư viện kiến thức và ô gợi ý khi gõ. Danh sách, phân trang, lọc danh mục và nội dung bài không đổi. Bài đang đặt lịch phát hành ngày mai trở đi nay không còn nằm trong kết quả cho tới đúng ngày"
  retest: "Chọn một bài có câu chỉ xuất hiện trong phần tóm tắt, gõ câu đó vào ô tìm: phải ra bài. Làm tương tự với một câu chỉ có trong phần nội dung, kể cả câu có chữ in đậm ở giữa: phải ra bài. Gõ một chuỗi không tồn tại: phải ra thông báo chưa có bài viết. Chuyển một bài về nháp rồi tìm lại bằng từ khóa của bài đó: không được ra. Kiểm cả trên điện thoại và máy tính"
  limit: "Tìm kiếm so khớp trên bản gốc của nội dung; nếu sau này bài có thêm bản dịch ngôn ngữ khác thì phần dịch chưa được tìm riêng. Portal đang chạy tiếng Việt nên chưa ảnh hưởng"

