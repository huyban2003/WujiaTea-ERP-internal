  build_override: "UAT | 15/08/2026 | Sprint 2026-08-15-C9 | commit: 9a8784b | Đã deploy UAT, wujia_portal_layout 19.0.31.17.0 + wujia_portal_sale 19.0.4.13.0 | Dev đã đo lại trên trình duyệt UAT ngày 15/08/2026 (chỉ đọc, không sửa dữ liệu) ở 360x640 và 391x844: tên sản phẩm rộng 277px trên thẻ 357px (trước 150px) và 246px trên máy 360px, cả 5 sản phẩm về 1 dòng, không đè giá hay nút giỏ | URL: /portal/order"
  url: "/portal/order — thẻ sản phẩm (điện thoại)"
  odoo_fit: "Custom"
  fix: "Thẻ sản phẩm trên điện thoại nay chia hai hàng theo đúng đề xuất của BA: tên sản phẩm chiếm trọn hàng trên, còn quy cách, đơn giá và nút thêm vào giỏ xuống hàng dưới. Nhờ vậy tên có 277 điểm ảnh thay vì 150 trên máy 391 và 246 thay vì 122 trên máy 360, phần lớn tên nay nằm gọn một dòng. Tên vẫn tối đa hai dòng và có dấu ba chấm khi thật sự quá dài. Ảnh sản phẩm vẫn ở bên trái, nút thêm vào giỏ và bộ tăng giảm số lượng giữ nguyên kích thước vùng bấm"
  impact: "Danh sách sản phẩm bản điện thoại ở trang Đặt hàng, kể cả sau khi lọc theo danh mục hoặc tìm kiếm. Bảng sản phẩm bản máy tính, giá, thuế và chức năng thêm vào giỏ không đổi. Thẻ cao thêm khoảng 20 điểm ảnh, đúng phần BA đã chấp nhận cho thẻ cao động"
  retest: "Mở trang Đặt hàng trên điện thoại: tên sản phẩm phải trải hết chiều rộng thẻ trước khi xuống dòng, tối đa hai dòng, không đè lên giá, quy cách hay nút giỏ. Kiểm với sản phẩm có tên rất dài và cả sản phẩm tên ngắn. Kiểm ở máy 360 và 391, trang không được trượt ngang. Thêm sản phẩm vào giỏ rồi kiểm bộ tăng giảm số lượng vẫn hoạt động và không làm vỡ thẻ"
  limit: "Không có"

WJ-PH-008:
  sprint: "2026-08-15-C9"
  build_override: "UAT | 15/08/2026 | Sprint 2026-08-15-C9 | commit: 9a8784b | Đã deploy UAT, wujia_portal_purchase_history 19.0.3.6.0 | Dev đã đo lại trên trình duyệt UAT ngày 15/08/2026 (chỉ đọc, không sửa dữ liệu) ở 1920x1080 và 391x844 với 15 đơn thật: mặc định 10 dòng, trang 1 hiện 1-10/15, trang 2 hiện 11-15/15, không trùng mã đơn | URL: /portal/purchase-history"
  url: "/portal/purchase-history — số dòng mỗi trang"
  odoo_fit: "Custom"
  fix: "Lịch sử đặt hàng nay mặc định 10 dòng mỗi trang đúng như quy định của bộ giao diện, thay vì 20. Ô chọn số dòng mỗi trang và phần kiểm tra ở máy chủ dùng chung một danh sách 10, 20, 50 nên không thể lệch nhau; nhập tay một con số lạ trên đường dẫn thì hệ thống trả về mặc định 10 chứ không tải bừa. Số dòng đang chọn được giữ lại khi tìm kiếm, khi lọc theo trạng thái hoặc khoảng ngày và khi chuyển trang. Tổng số bản ghi, số trang và thứ tự đơn giữ nguyên, không có đơn nào bị lặp hay bỏ sót giữa các trang"
  impact: "Trang Lịch sử đặt hàng, cả bản máy tính lẫn điện thoại. Nội dung đơn, bộ lọc, quyền xem và trang chi tiết đơn không đổi. Người đang quen xem 20 dòng chỉ cần chọn lại 20 ở ô số dòng mỗi trang"
  retest: "Mở Lịch sử đặt hàng khi cửa hàng có hơn 10 đơn: ô số dòng phải hiện 10 và trang 1 có đúng 10 dòng. Sang trang 2 và đối chiếu mã đơn với trang 1: không được trùng, cộng lại phải đủ tổng bản ghi ghi ở góc trái. Chọn 20 dòng rồi bấm tìm kiếm hoặc lọc trạng thái: ô số dòng phải vẫn là 20. Sửa đường dẫn thành page_size bằng một số lạ: trang vẫn mở bình thường và về 10 dòng"
  limit: "Không có"

WJ-EXAM-007:
  sprint: "2026-08-18-C10"
  build_override: "UAT | 18/08/2026 | Sprint 2026-08-18-C10 | commit: f99321b | Đã deploy UAT, wujia_portal_exam 19.0.5.6.0 | Dev đã đo lại trên trình duyệt UAT ngày 18/08/2026 (chỉ đọc, không tạo phiếu) ở 1920x1080: khóa QA-MANUAL-HCM-20260803 hiện đúng tối đa 2 người ở cả câu hướng dẫn lẫn ô Giới hạn mỗi phiếu (0 / 2), đổi sang khóa Thi pha chế định kỳ thì cả hai thành 4 | URL: /portal/exam/register"
  url: "/portal/exam/register — Giới hạn người tham gia"
  odoo_fit: "Custom"
  fix: "Màn đăng ký thi trước đây có câu hướng dẫn ghi cứng tối đa 4 người, trong khi ô Giới hạn mỗi phiếu lấy số thật từ cấu hình nên hai chỗ đá nhau. Nay mọi vị trí đều đọc cùng một nguồn: giới hạn của ca thi, ca nào để trống thì lấy giới hạn của khóa thi. Đổi khóa hoặc chọn ca khác thì câu hướng dẫn, ô giới hạn và thông báo khi thêm quá số người đều đổi theo cùng lúc. Máy chủ vẫn kiểm lại đúng giới hạn đó khi gửi phiếu nên không thể gửi vượt bằng cách sửa trình duyệt. Bản điện thoại cũng bỏ hết số 4 mặc định, lấy theo ca thi đã chọn. Giá trị đang có hiệu lực với khóa BA kiểm thử là 2 người mỗi phiếu"
  impact: "Màn đăng ký thi trên máy tính và điện thoại. Cấu hình khóa thi và ca thi trong phần quản trị không đổi, dữ liệu phiếu đã có không đổi. Muốn đổi giới hạn thì sửa ở ca thi hoặc khóa thi, giao diện tự cập nhật"
  retest: "Mở màn đăng ký thi với khóa có giới hạn 2: câu hướng dẫn phải ghi tối đa 2 người và ô Giới hạn mỗi phiếu phải là 0 / 2, không còn chỗ nào ghi 4. Đổi sang khóa giới hạn 4: cả hai chỗ phải thành 4. Chọn một ca thi có cấu hình riêng khác khóa: cả hai chỗ phải lấy số của ca thi. Thêm người tới đúng giới hạn rồi thêm tiếp: phải bị chặn kèm thông báo ghi đúng con số đó. Đổi giới hạn trong phần quản trị rồi tải lại trang: giao diện phải hiện số mới"
  limit: "Trên UAT hiện không còn ca thi nào mở để chọn (ca duy nhất của khóa QA-MANUAL đã hết hạn ngày 16/08/2026), nên phần lấy giới hạn theo ca thi Dev đo trên bản sao cơ sở dữ liệu chứ chưa đo được trực tiếp trên UAT. Muốn retest trọn vẹn phần này, nhờ BA mở thêm một ca thi còn hạn, tốt nhất là ca có giới hạn khác với giới hạn của khóa"

WJ-LANG-001:
  sprint: "2026-08-18-C10"
  build_override: "UAT | 18/08/2026 | Sprint 2026-08-18-C10 | commit: f99321b | Đã deploy UAT, wujia_portal_layout 19.0.31.18.0 | Dev đã đo lại trên trình duyệt UAT ngày 18/08/2026 (chỉ đọc) ở 1920x1080 và 391x844: bộ chọn ra đủ ba ngôn ngữ English, Tiếng Việt, ภาษาไทย trên máy tính, điện thoại và màn đăng nhập; chọn tiếng Thái ngay ở màn đăng nhập rồi đăng nhập vẫn giữ tiếng Thái qua nhiều trang; đã trả tài khoản về tiếng Việt sau khi đo | URL: /portal"
  url: "Portal toàn hệ thống — bộ chọn ngôn ngữ (máy tính, điện thoại, màn đăng nhập)"
  odoo_fit: "Custom"
  fix: "Bộ chọn ngôn ngữ trước đây viết cứng đúng hai mục English và Vietnam trong giao diện, nên cài thêm ngôn ngữ mới thì không hiện. Nay danh sách lấy động theo các ngôn ngữ đang bật trong phần cài đặt: bật thêm ngôn ngữ nào là portal có ngay mục đó, kể cả tiếng Thái hay tiếng Trung phồn thể, không phải sửa gì thêm. Tên ngôn ngữ hiển thị theo tên bản ngữ và cờ lấy theo mã ngôn ngữ. Màn đăng nhập trước đây chỉ có ô ngôn ngữ trang trí, nay bấm đổi được thật; ngôn ngữ chọn lúc chưa đăng nhập được giữ lại sau khi đăng nhập. Thẻ ngôn ngữ của trang cũng đổi theo ngôn ngữ đang dùng thay vì ghim sẵn"
  impact: "Thanh trên cùng bản máy tính, thanh trên cùng bản điện thoại và màn đăng nhập của portal. Cách đổi ngôn ngữ vẫn dùng đường dẫn cũ, tiếng Anh và tiếng Việt hoạt động như trước. Không thêm bảng dữ liệu, không đổi cấu hình ngôn ngữ hiện có"
  retest: "Mở portal trên máy tính: bộ chọn phải có đủ ba mục English, Tiếng Việt và tiếng Thái, mục đang dùng hiện đúng tên và cờ. Kiểm tương tự trên điện thoại và ở màn đăng nhập. Chọn tiếng Thái rồi chuyển qua vài trang: vẫn giữ tiếng Thái. Chọn tiếng Thái ngay ở màn đăng nhập rồi đăng nhập: vẫn là tiếng Thái. Đổi lại tiếng Việt và tiếng Anh: phải chuyển bình thường. Nhờ quản trị bật thêm một ngôn ngữ khác trong phần cài đặt rồi tải lại portal: mục mới phải tự xuất hiện"
  limit: "Cụm này chỉ sửa bộ chọn và cơ chế đổi ngôn ngữ. Nội dung tiếng Việt trong portal là bản gốc nên khi chọn tiếng Thái, phần nào chưa có bản dịch trong tệp ngôn ngữ vẫn hiển thị tiếng Việt. Ngoài ra ba chỗ nhãn đang được cố định tiếng Việt từ đợt chuẩn hóa ngôn ngữ trước (trạng thái nhượng quyền, mức độ ưu tiên ở chuông thông báo, loại yêu cầu cập nhật thông tin) vẫn ra tiếng Việt ở mọi ngôn ngữ; gỡ chỗ này cần BA chốt từ vựng nên chưa đụng tới"

WJ-PORTAL-UI-001:
  sprint: "2026-08-19-C6"
  build_override: "UAT | 19/08/2026 | Sprint 2026-08-19-C6 | commit: 159ffe3 | Đã deploy UAT, wujia_portal_layout 19.0.31.19.0 + wujia_portal_sale | Dev đã đo lại trực tiếp trên UAT sau khi deploy ngày 19/08/2026 (chỉ đọc, không sửa dữ liệu) ở 1920x1080 và 391x844 trên 22 trang: không còn thành phần bấm được nào gạch chân (trước 18 trên máy tính và 34 trên điện thoại), mọi thành phần bấm được đều có viền chỉ dấu bàn phím dày 2 điểm ảnh cách 2 điểm ảnh màu #0F7CA8 (trước thiếu 46 và 43 chỗ), đi phím Tab thật qua 5 trang thì 124 trên 124 điểm dừng đều thấy viền, không trang nào đổi chiều cao hay trượt ngang, không lỗi trình duyệt | URL: toàn bộ Portal"

  url: "Portal toàn hệ thống — trạng thái hover, chỉ dấu bàn phím và trạng thái nhấn của mọi thành phần bấm được"
  odoo_fit: "Custom"
  fix: "Chữ trong khung, dòng danh sách, mục menu, nút, thẻ lọc, tab và nút biểu tượng không còn gạch chân ở bất kỳ trạng thái nào; chỉ liên kết chữ trong câu và nội dung bài viết do người dùng soạn mới giữ gạch chân. Nguyên nhân không nằm ở từng màn mà ở một quy tắc duy nhất của bộ giao diện gốc Odoo: bộ này được nạp sau toàn bộ giao diện riêng của Wujia nên mọi khai báo bỏ gạch chân rải rác trước đó đều bị đè. Vì vậy thay vì vá tiếp từng chỗ, toàn bộ trạng thái tương tác được gom về một tệp dùng chung nạp sau cùng, viết bằng biến màu thay vì mã màu rải rác. Kèm theo đó: khung và dòng trung tính khi rê chuột đổi nền xanh nhạt, viền xanh và có bóng nhẹ trong 150 mili giây; khi bấm hoặc chạm thì đổi nền và viền ngay lúc chạm rồi trả lại khi nhả, không giữ vệt gạch chân sau khi chạm; đi bằng phím Tab thì mọi điểm dừng đều có viền chỉ dấu dày 2 điểm ảnh cách thành phần 2 điểm ảnh, trước đây gần như không nhìn thấy gì. Riêng chỗ danh sách bài kiến thức trước đây rê chuột ra màu tím lạ của bộ giao diện gốc, nay về đúng màu nhận diện Wujia. Hiệu ứng chỉ đổi màu nền, màu viền và bóng nên không thành phần nào bị xê dịch hay đổi kích thước"
  impact: "Toàn bộ giao diện Portal trên cả máy tính lẫn điện thoại, vì đây là tầng dùng chung. Không đụng tới dữ liệu, quyền xem, luồng nghiệp vụ hay bố cục: đã đo 22 trang ở hai khổ màn hình, không trang nào đổi chiều cao, không trang nào trượt ngang, không lỗi trình duyệt. Bảng đo diện rộng của đợt trước giữ nguyên 282 trên 286 điểm, đúng bằng số trước khi sửa. Nút primary, nút hành động chính và thẻ lọc đang được chọn giữ nguyên màu đã thiết kế, chỉ được hưởng phần bỏ gạch chân và viền chỉ dấu bàn phím"
  retest: "Mở lần lượt các trang Portal trên máy tính rồi trên điện thoại. Rê chuột lên khung, dòng danh sách, mục menu, nút, thẻ lọc, tab và nút biểu tượng: không chỗ nào được gạch chân chữ, khung và dòng trung tính phải đổi nền xanh nhạt kèm viền xanh và bóng nhẹ, và không thành phần nào bị nhích đi hay đổi kích thước. Mở một bài kiến thức có liên kết trong nội dung: liên kết trong câu vẫn phải gạch chân. Nhấn phím Tab liên tục qua một trang: mỗi điểm dừng phải thấy rõ viền chỉ dấu màu xanh đậm, không được mất dấu đang ở đâu. Trên điện thoại, chạm giữ vào một khung: nền và viền phải đổi lúc chạm và trở lại như cũ khi nhả, không còn vệt gạch chân. Kiểm thêm danh sách bài kiến thức: rê chuột không được ra màu tím"
  limit: "Viền chỉ dấu bàn phím dùng màu xanh đậm #0F7CA8 chứ không phải #168FC2 như mô tả trong yêu cầu. Lý do: #0F7CA8 đúng bằng viền chỉ dấu mà nhóm nút hành động chính đang dùng và BA đã duyệt ở đợt trước, đồng thời tương phản 4,71 lần so với nền trắng trong khi #168FC2 chỉ 3,32 lần, tức #168FC2 chưa đạt mức dễ nhìn theo chuẩn. Muốn đổi lại đúng #168FC2 thì chỉ sửa một biến màu, nhờ BA xác nhận. Ngoài ra nhóm đã có trạng thái riêng theo bộ giao diện gồm nút hành động chính, thẻ lọc và mục menu đang được chọn, và các nút trên thanh nền tối được cố ý giữ nguyên màu: ép nền xanh nhạt vào nút hành động chính sẽ làm chữ trắng gần như không đọc được, còn ép vào thẻ lọc đang chọn sẽ mất dấu hiệu đang chọn. Trạng thái lúc chạm mới chỉ đo bằng trình duyệt giả lập điện thoại, chưa đo trên máy thật, nhờ BA kiểm hộ khi retest"
