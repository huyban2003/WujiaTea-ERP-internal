  fix: "Trên điện thoại, dòng cửa hàng đang thao tác trước đây chỉ để đọc, bấm vào không có gì xảy ra nên người dùng nhiều cửa hàng không đổi được nơi làm việc. Nay bấm vào dòng này sẽ mở đúng cửa sổ Đổi cửa hàng đang thao tác của bản máy tính, dùng chung một luồng chứ không làm luồng riêng: danh sách chỉ gồm cửa hàng người dùng được phép, cửa hàng đang chọn được đánh dấu sẵn, bấm Huỷ hoặc đóng thì không thay đổi gì, bấm Xác nhận thì đổi cửa hàng và ở lại đúng trang đang xem. Người chỉ có một cửa hàng thì dòng này vẫn để đọc như cũ, không tạo cảm giác bấm được rồi không có gì xảy ra. Hình thức và khoảng cách của dòng giữ nguyên hoàn toàn"
  impact: "Dòng cửa hàng đang thao tác trên điện thoại, ở mọi trang portal. Bản máy tính, quyền truy cập cửa hàng và cách đổi cửa hàng bên trong đều không đổi, vì dùng lại đúng cửa sổ và đúng đường xử lý sẵn có"
  retest: "Lưu ý dùng tài khoản cửa hàng, KHÔNG dùng tài khoản quản trị: tài khoản quản trị trên UAT không gắn cửa hàng nào nên dòng cửa hàng không hiện, không kiểm được. Đăng nhập bằng tài khoản có từ hai cửa hàng, mở portal trên điện thoại: bấm vào dòng cửa hàng đang thao tác, cửa sổ Đổi cửa hàng phải mở, đánh dấu đúng cửa hàng hiện tại và liệt kê đủ các cửa hàng được phép. Bấm Huỷ rồi bấm dấu × : dòng cửa hàng phải giữ nguyên. Mở lại, chọn cửa hàng khác rồi Xác nhận: dòng cửa hàng phải đổi mã, tên và vai trò, vẫn ở đúng trang cũ, dữ liệu trên trang và số trên giỏ hàng phải theo cửa hàng mới. Xem ở khổ 391×844: cửa sổ không được tràn ra ngoài màn hình hay chồng lên nội dung. Đăng nhập bằng tài khoản chỉ có một cửa hàng: bấm vào dòng đó không được mở gì"
  limit: "Phần đổi cửa hàng trên điện thoại đã chạy đủ end-to-end trên bản sao dữ liệu thật trước khi giao. Sau khi lên UAT, Dev chưa tự kiểm lại được vì tài khoản quản trị không gắn cửa hàng nào nên dòng cửa hàng đang thao tác không hiện; cần BA retest bằng tài khoản có từ hai cửa hàng"

WJ-FRANCHISE-001:
  sprint: "2026-08-15-C1"
  build_override: "UAT | 15/08/2026 | Sprint 2026-08-15-C1 | commit: b623b70 | Đã deploy UAT (wujia_franchise 19.0.2.1.0, wujia_sale 19.0.4.3.0, wujia_delivery 19.0.1.1.0, wujia_account 19.0.1.1.0, đã chạy bước cập nhật dữ liệu) | Deploy: -u wujia_franchise,wujia_sale,wujia_delivery,wujia_account (CÓ bước cập nhật dữ liệu, điền cửa hàng cho chứng từ cũ đang bỏ trống) | URL: Odoo Backend — Đơn bán / Phiếu kho / Hóa đơn"
  url: "Odoo Backend: Bán hàng > Đơn bán; Tồn kho > Phiếu giao; Kế toán > Hóa đơn khách hàng"
  odoo_fit: "Custom"
  fix: "Chọn một khách hàng là cửa hàng nhượng quyền trên đơn bán, phiếu kho hoặc hóa đơn thì hệ thống tự điền Cửa hàng nhượng quyền; riêng đơn bán còn tự điền Partner cửa hàng và Khu vực. Việc tự điền nay chạy ở mọi đường tạo dữ liệu, kể cả nhập khẩu và tích hợp, chứ không chỉ khi thao tác trên màn hình. Đổi sang khách hàng thuộc cửa hàng khác thì cửa hàng được tính lại chứ không giữ giá trị cũ; người dùng vẫn được quyền chọn tay cửa hàng khác khi cần. Nếu một khách hàng đang gắn với nhiều cửa hàng thì hệ thống không đoán, để trống và hiện cảnh báo liệt kê các cửa hàng trùng. Địa chỉ giao hàng là địa chỉ con của cửa hàng cũng nhận đúng cửa hàng mẹ. Lần cập nhật này còn điền cửa hàng cho các chứng từ CŨ đang bỏ trống mà khách hàng chỉ thuộc một cửa hàng; chứng từ đã có cửa hàng thì giữ nguyên, không ghi đè"
  impact: "Trường Cửa hàng nhượng quyền trên đơn bán, phiếu kho và hóa đơn khách hàng, cùng Partner cửa hàng và Khu vực trên đơn bán. Quy tắc hạch toán, giá, tồn kho và quyền xem không đổi. Portal đặt hàng không đổi vì vốn đã tự truyền cửa hàng khi tạo đơn"
  retest: "Tạo đơn bán mới, chọn khách hàng Wujia Tea — TP HCM Quận 1: Cửa hàng nhượng quyền phải tự hiện [HCM-01], Partner cửa hàng và Khu vực cũng phải tự điền. Đổi khách hàng sang Wujia Tea — Hà Nội Cầu Giấy: cửa hàng phải đổi sang [HN-01], không được giữ [HCM-01]. Làm tương tự trên phiếu kho mới và hóa đơn khách hàng mới. Với khách hàng đang gắn hai cửa hàng: ô cửa hàng phải để trống và hiện cảnh báo nêu tên hai cửa hàng đó. Với đơn đã tạo trước đây mà bỏ trống cửa hàng: sau khi cập nhật phải thấy đã được điền đúng theo khách hàng"
  limit: "Khách hàng không gắn với cửa hàng nào (khách lẻ, nhà cung cấp) thì hệ thống im lặng, không hiện cảnh báo — nếu cảnh báo thì mọi hóa đơn mua hàng và bút toán đều bung thông báo, gây nhiễu. Xin BA xác nhận cách xử lý này. Chứng từ cũ đã có cửa hàng khác với khách hàng thì giữ nguyên, không tự sửa"

