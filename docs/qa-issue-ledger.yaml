  impact: "Toàn bộ 17 màn của bảng đặt tên, trên cả máy tính lẫn điện thoại. Ba màn nhóm Tài khoản (Thông tin tài khoản, Đổi mật khẩu, Thông tin cửa hàng) dùng chung khung tiêu đề mới nên cũng thay đổi hình thức phần đầu trang; câu mô tả phụ dưới tiêu đề vẫn giữ nguyên nội dung. Dữ liệu, quyền xem, quyền tạo mới và nghiệp vụ không đổi. Thanh trên cùng, dòng cửa hàng đang thao tác, menu trái và thanh dưới của điện thoại không đụng tới"
