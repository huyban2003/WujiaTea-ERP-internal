  fix: "Phần cờ: mã nguồn vốn ĐÚNG — thanh trên cùng luôn hiển thị cờ và tên ngôn ngữ theo ngôn ngữ của chính tài khoản đang đăng nhập. Đo lại 6 trang ngày 02/08 và 5 trang ngày 04/08 đều ra cờ Việt Nam. BA nhìn thấy cờ Mỹ là vì tài khoản dùng để kiểm thử đang để ngôn ngữ Tiếng Anh. Theo quyết định của chủ dự án 03/08, hệ thống nay MẶC ĐỊNH đặt tiếng Việt cho mọi tài khoản cửa hàng: tài khoản tạo mới tự nhận tiếng Việt, và các tài khoản đã tạo trước đó được chuyển sang tiếng Việt khi cập nhật. Sau khi cập nhật lên máy chủ kiểm thử, đếm được 6 tài khoản cửa hàng và 0 tài khoản còn để ngôn ngữ khác. Phần hình học của ô chọn ngôn ngữ cũng được đưa về đúng bản thiết kế (phần này là tuỳ biến giao diện)"
