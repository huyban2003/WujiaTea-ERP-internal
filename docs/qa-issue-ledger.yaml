  limit: "Hai điểm xin BA chốt: (1) bảng đặt tên ghi màn Đăng ký thi là chỉ có tiêu đề, nhưng màn này đang có nút Đăng ký mới và chính đặc tả cấm đổi nút sẵn có, nên Dev tạm giữ nút; (2) còn bốn chỗ hiện số đếm rời nằm ở các màn mà bảng ghi chỉ có tiêu đề (Kiến thức, Đăng ký thi, Bù hàng), Dev giữ nguyên tại chỗ chứ không tự thêm số vào tiêu đề. Nút Quay lại giữ nguyên hình dạng hiện tại, sẽ chuẩn hoá ở issue UI-BACKPAGEHEADER-001. Mã chứng từ hiện nằm trong thẻ thông tin sẵn có chứ chưa phải khối Tóm tắt chứng từ chuẩn, vì thành phần đó chưa có đặc tả. Lề trái phải trên máy tính vẫn do khung nội dung của giao diện nền cấp, chưa tách thành thành phần riêng"

