  url: "/portal/debt (cả điện thoại và máy tính)"
  odoo_fit: "Custom"
  fix: "Thẻ tổng quan tuần và từng dòng hóa đơn nay suy ra trạng thái theo cùng một quy tắc nên không còn nói khác nhau. Tuần có hóa đơn mà chưa trả đồng nào ghi Chưa thanh toán ở cả hai chỗ; chỉ khi đã trả được một phần, tức số còn lại nhỏ hơn tổng, mới ghi Thanh toán một phần; có hóa đơn quá hạn thì ưu tiên Có quá hạn; trả hết thì Đã thanh toán. Đã thanh toán bằng 0 và Còn phải trả bằng số dư thật của hóa đơn. So sánh số tiền theo mức làm tròn của chính loại tiền trên hóa đơn nên số lẻ không làm lệch trạng thái"
  impact: "Nhãn trạng thái của thẻ tổng quan trên màn Công nợ, cả điện thoại lẫn máy tính. Số liệu, quyền xem và cách lấy dữ liệu không đổi; danh sách hóa đơn, lịch sử thanh toán và màn thanh toán không đụng tới"
  retest: "Mở Công nợ ở tuần có đúng một hóa đơn chưa trả đồng nào: thẻ tổng quan và dòng hóa đơn phải cùng ghi Chưa thanh toán, Đã thanh toán bằng 0, Còn phải trả bằng đúng giá trị hóa đơn. Ghi nhận một khoản thanh toán một phần cho hóa đơn đó rồi mở lại: cả hai chỗ phải chuyển sang Thanh toán một phần. Đối soát nốt phần còn lại: cả hai chuyển sang Đã thanh toán. Tuần có hóa đơn quá hạn: thẻ ghi Có quá hạn. Kiểm ở cả điện thoại và máy tính"
  limit: "Nhãn Chưa thanh toán do Dev đề xuất cho đồng bộ với dòng hóa đơn; BA đổi chữ được ở vòng retest"

