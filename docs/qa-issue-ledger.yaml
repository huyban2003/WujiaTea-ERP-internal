  retest: "Đăng nhập bằng một tài khoản cửa hàng bất kỳ: thanh trên cùng phải hiện cờ Việt Nam kèm chữ 'Việt Nam'. Ô chọn ngôn ngữ nằm tại 1450,16 kích thước 118×40. Nếu vẫn thấy cờ Mỹ thì kiểm tra lại ngôn ngữ của chính tài khoản đó trong màn hình quản trị — người dùng vẫn được phép tự đổi sang Tiếng Anh nếu muốn"
